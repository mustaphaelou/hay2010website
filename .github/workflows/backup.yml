# Nightly backup rehearsal and off-site dump watchdog (ticket #31).
#
# Decision: docs/hosting/deployment-decision.md §3.5 / §4.5. The *production*
# dumps are produced by Coolify's own Postgres backup schedule directly into
# Cloudflare R2 (`hay2010-backups`) — documented in docs/ops/runbook.md
# "Backups", because a GitHub runner cannot reach the internal-only database.
# This workflow adds the two things GitHub Actions is good at:
#
#   rehearsal — nightly, disposable Postgres 16 + MinIO (S3-compatible stand-in
#               for R2): run scripts/backup-postgres.sh, upload through rclone,
#               restore with scripts/restore-postgres.sh into a scratch database
#               containing a conflicting table, verify the rows. Catches script
#               regression before an incident needs them.
#   watchdog  — nightly, read-only: the newest non-empty object under
#               `postgres/` in the real R2 bucket must be younger than 36 h. A
#               failed scheduled run is the "backup failure reaches a human"
#               alert required by the decision.
#
# Secrets/variables the watchdog needs (docs/ops/external-steps.md §4):
#   secrets.R2_BACKUP_READ_KEY_ID / R2_BACKUP_READ_SECRET  (read-only R2 token)
#   vars.R2_BACKUP_ENDPOINT / vars.R2_BACKUP_BUCKET
# Missing configuration is a notice, not a failure, until the bucket exists.

name: Backup rehearsal and watchdog

on:
  schedule:
    - cron: "17 3 * * *" # UTC, after the server-time nightly dump
  workflow_dispatch:
  push:
    paths:
      - "scripts/backup-postgres.sh"
      - "scripts/restore-postgres.sh"
      - "scripts/rehearse-backup-restore.sh"
      - ".github/workflows/backup.yml"

permissions:
  contents: read

env:
  RCLONE_VERSION: "1.76.0"

jobs:
  rehearsal:
    name: Dump → object storage → restore rehearsal
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install rclone (pinned)
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            aarch64|arm64) ARCH=arm64 ;;
            *) ARCH=amd64 ;;
          esac
          curl -fsSL -o /tmp/rclone.zip \
            "https://downloads.rclone.org/v${RCLONE_VERSION}/rclone-v${RCLONE_VERSION}-linux-${ARCH}.zip"
          unzip -q /tmp/rclone.zip -d /tmp
          echo "/tmp/rclone-v${RCLONE_VERSION}-linux-${ARCH}" >> "$GITHUB_PATH"

      - name: Start MinIO (S3-compatible stand-in for R2)
        run: |
          set -euo pipefail
          docker run -d --name backup-rehearsal-minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=rehearsal \
            -e MINIO_ROOT_PASSWORD=rehearsal-not-a-secret \
            minio/minio:latest server /data
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::MinIO did not become ready"
          exit 1

      - name: Configure the rclone S3 remote
        run: |
          set -euo pipefail
          cat > /tmp/rehearsal-rclone.conf <<'EOF'
          [rehearsal]
          type = s3
          provider = Minio
          access_key_id = rehearsal
          secret_access_key = rehearsal-not-a-secret
          endpoint = http://127.0.0.1:9000
          region = us-east-1
          force_path_style = true
          EOF
          RCLONE_CONFIG=/tmp/rehearsal-rclone.conf rclone mkdir rehearsal:hay2010-backups

      - name: Rehearse backup and restore against real object storage
        env:
          RCLONE_CONFIG: /tmp/rehearsal-rclone.conf
          REHEARSAL_RCLONE_REMOTE: rehearsal:hay2010-backups/postgres
        run: bash scripts/rehearse-backup-restore.sh

      - name: Upload rehearsal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backup-rehearsal-${{ github.run_id }}
          path: |
            /tmp/hay2010-rehearsal*/backup.log
            /tmp/hay2010-rehearsal*/restore.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Clean up MinIO
        if: always()
        run: docker rm -f backup-rehearsal-minio >/dev/null 2>&1 || true

  watchdog:
    name: Newest off-site dump is fresh
    needs: rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check the newest object in the backup bucket
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_READ_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_READ_SECRET }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ vars.R2_BACKUP_ENDPOINT }}
          BACKUP_BUCKET: ${{ vars.R2_BACKUP_BUCKET }}
          PREFIX: postgres/
          MAX_AGE_HOURS: "36"
        run: |
          set -euo pipefail
          if [ -z "${AWS_ACCESS_KEY_ID}" ] || [ -z "${R2_ENDPOINT}" ] || [ -z "${BACKUP_BUCKET}" ]; then
            echo "::notice title=Backup watchdog not configured::Set secrets.R2_BACKUP_READ_KEY_ID, secrets.R2_BACKUP_READ_SECRET, vars.R2_BACKUP_ENDPOINT and vars.R2_BACKUP_BUCKET (docs/ops/external-steps.md §4)."
            exit 0
          fi
          listing="$(aws s3api list-objects-v2 \
            --endpoint-url "$R2_ENDPOINT" \
            --bucket "$BACKUP_BUCKET" \
            --prefix "$PREFIX" \
            --output json)"
          key="$(jq -r '[.Contents[]? | select(.Size > 0)] | sort_by(.LastModified) | last | .Key // empty' <<<"$listing")"
          modified="$(jq -r '[.Contents[]? | select(.Size > 0)] | sort_by(.LastModified) | last | .LastModified // empty' <<<"$listing")"
          if [ -z "$key" ] || [ -z "$modified" ]; then
            echo "::error::No non-empty backup object under ${PREFIX} in ${BACKUP_BUCKET}"
            exit 1
          fi
          age_hours=$(( ( $(date -u +%s) - $(date -u -d "$modified" +%s) ) / 3600 ))
          echo "newest: ${key} (${age_hours}h old)"
          if [ "$age_hours" -gt "$MAX_AGE_HOURS" ]; then
            echo "::error::Newest backup is ${age_hours}h old (limit ${MAX_AGE_HOURS}h)"
            exit 1
          fi
